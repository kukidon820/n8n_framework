[project]
name = "n8n-transcriper"
version = "0.1.0"
description = "Generate standalone Python projects from n8n workflows"
requires-python = ">=3.11"
dependencies = ["typer>=0.12"]

[project.scripts]
n8n-transcriper = "n8n_transcriper.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/n8n_transcriper"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]
